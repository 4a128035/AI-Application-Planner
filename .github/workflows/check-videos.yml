name: Check video links

# Separate from deployment so a YouTube hiccup never blocks publishing the site.
on:
  schedule:
    - cron: '0 1 * * 1'   # every Monday 09:00 Taiwan time
  push:
    branches: [main]
    paths: ['src/data/videos.json', 'scripts/check-videos.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-videos.mjs
