name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every morning (06:00 Taiwan): update the AI news archive, then rebuild and deploy.
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only on the daily schedule (or a manual run): fetch RSS, merge into src/data/news-archive.json and commit it.
  # This is the only job with write access. It runs our own script with no npm dependencies, and feed content
  # is treated as plain data. A push made with GITHUB_TOKEN does not trigger this workflow again.
  news:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/update-news.mjs
      - name: Commit the archive if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news-archive.json
          git diff --cached --quiet || { git commit -m "Update AI news archive" && git push; }

  build:
    needs: news
    # Runs on every push (news is skipped) and after the daily news update, even if fetching news failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block known high-severity vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # Explicit, because a skipped news job would otherwise skip deploy too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
